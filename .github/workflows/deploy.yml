name: Deploy to GitHub Pages

# main 에 푸시하면 자동으로 빌드해서 배포한다.
# 폰에서는 이 배포본을 쓰므로, 앱을 고치고 푸시하면 폰에도 반영된다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치지 않게 한 번에 하나만 돌린다.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # 배포본에는 API 키를 넣지 않는다. 사용자가 앱 설정에서 직접 입력한다.
      # 번들에 키가 박히면 사이트를 여는 누구나 볼 수 있다.
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
